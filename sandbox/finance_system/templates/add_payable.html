{% extends "base.html" %}

{% block title %}Add Accounts Payable Entry{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.25rem;">
      <a href="/payables" style="color: var(--primary); text-decoration: none;">&larr; Back to Ledger</a>
    </div>
    <h1>Add Accounts Payable</h1>
    <p>Record a validated vendor invoice for internal accounting and disbursement queue.</p>
  </div>
</div>

<div class="card form-card">
  {% if error %}
    <div class="alert alert-danger" id="form-error">
      {{ error }}
    </div>
  {% endif %}

  <form method="post" action="/payables/add" id="add-payable-form">
    <div class="form-group">
      <label for="vendor">Vendor Name *</label>
      <input type="text" id="vendor" name="vendor" class="form-control" placeholder="e.g. Acme Cloud Corp" value="{{ form_data.vendor if form_data else '' }}" required autofocus>
    </div>

    <div class="form-group">
      <label for="invoice_no">Invoice Number *</label>
      <input type="text" id="invoice_no" name="invoice_no" class="form-control" placeholder="e.g. INV-ACME-1004" value="{{ form_data.invoice_no if form_data else '' }}" required>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
      <div class="form-group">
        <label for="amount">Invoice Amount (USD) *</label>
        <input type="number" step="0.01" min="0.01" id="amount" name="amount" class="form-control" placeholder="2490.75" value="{{ form_data.amount if form_data else '' }}" required>
      </div>

      <div class="form-group">
        <label for="due_date">Due Date (YYYY-MM-DD) *</label>
        <input type="date" id="due_date" name="due_date" class="form-control" value="{{ form_data.due_date if form_data else '' }}" required>
      </div>
    </div>

    <div class="form-group">
      <label for="notes">Notes / Extraction Memo (Optional)</label>
      <textarea id="notes" name="notes" class="form-control" rows="3" placeholder="Extracted by Autonomous AI Task Worker from Vendor Portal statements.">{{ form_data.notes if form_data else '' }}</textarea>
    </div>

    <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
      <button type="submit" id="btn-submit-payable" class="btn btn-primary" style="flex: 2;">
        Submit Payable Entry
      </button>
      <a href="/payables" class="btn btn-secondary" style="flex: 1; text-align: center;">
        Cancel
      </a>
    </div>
  </form>
</div>
{% endblock %}
