{% extends "base.html" %}

{% block title %}Sign In - Vendor Portal{% endblock %}

{% block content %}
<div class="card form-card">
  <div style="text-align: center; margin-bottom: 1.5rem;">
    <h2>Vendor Portal Login</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.35rem;">
      Authenticate to access company invoices and billing records.
    </p>
  </div>

  {% if error %}
    <div class="alert alert-danger" id="login-error">
      {{ error }}
    </div>
  {% endif %}

  <form method="post" action="/login">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" class="form-control" placeholder="vendor_admin" value="{{ username or '' }}" required autofocus>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
    </div>

    <div style="margin-top: 1.5rem;">
      <button type="submit" id="btn-login-submit" class="btn btn-primary" style="width: 100%;">
        Sign In to Portal
      </button>
    </div>
  </form>

  <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 0.8rem; color: var(--text-muted); text-align: center;">
    <span>Default Demo Credentials:</span> <code>vendor_admin</code> / <code>vendor_pass123</code>
  </div>
</div>
{% endblock %}
