<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Vendor Portal{% endblock %} - CentrAlign Ecosystem</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <a href="/vendors" class="brand">
      <span>Enterprise Vendor Network</span>
      <span class="brand-badge">Port 8001</span>
    </a>
    <nav>
      {% if authenticated %}
        <a href="/vendors">Vendor Directory</a>
        <a href="/api/debug/state" target="_blank" style="font-size: 0.8rem; color: #94a3b8;">[Debug State API]</a>
        <form action="/logout" method="post" style="display:inline;">
          <button type="submit" class="btn-logout">Logout ({{ user }})</button>
        </form>
      {% else %}
        <a href="/login" class="btn btn-primary btn-sm">Login</a>
      {% endif %}
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>Vendor Management Portal &bull; Simulated Environment for Autonomous AI Task Worker &bull; Ground-truth testing enabled</p>
  </footer>
</body>
</html>
